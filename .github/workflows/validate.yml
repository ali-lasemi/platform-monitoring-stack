name: Validate monitoring stack

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PROMETHEUS_VERSION: v3.5.0
      GRAFANA_VERSION: 12.1.0
      LOKI_VERSION: 3.5.3
      ALERTMANAGER_VERSION: v0.28.1
      NODE_EXPORTER_VERSION: v1.9.1
      CADVISOR_VERSION: v0.52.1
      GRAFANA_ADMIN_USER: ci-admin
      GRAFANA_ADMIN_PASSWORD: ci-validation-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus:/etc/prometheus:ro" \
            prom/prometheus:${PROMETHEUS_VERSION} \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus/rules:/rules:ro" \
            prom/prometheus:${PROMETHEUS_VERSION} \
            promtool check rules /rules/platform-alerts.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool \
            prom/alertmanager:${ALERTMANAGER_VERSION} \
            check-config /etc/alertmanager/alertmanager.yml
