name: Validate monitoring stack

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PROMETHEUS_VERSION: v3.5.0
      GRAFANA_VERSION: 12.1.0
      LOKI_VERSION: 3.5.3
      ALERTMANAGER_VERSION: v0.28.1
      NODE_EXPORTER_VERSION: v1.9.1
      CADVISOR_VERSION: v0.52.1
      GRAFANA_ADMIN_USER: ci-admin
      GRAFANA_ADMIN_PASSWORD: ci-validation-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "${{ github.workspace }}/examples/prometheus/rules/platform-alerts.yml:/etc/prometheus/rules/platform-alerts.yml:ro" \
            -v "${{ github.workspace }}/examples/prometheus/rules/slo-rules.yml:/etc/prometheus/rules/slo-rules.yml:ro" \
            -v "${{ github.workspace }}/examples/prometheus/targets:/etc/prometheus/targets:ro" \
            --entrypoint promtool \
            prom/prometheus:${PROMETHEUS_VERSION} \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus/rules:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:${PROMETHEUS_VERSION} \
            check rules /rules/platform-alerts.yml

      - name: Test Prometheus alert rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus/rules:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:${PROMETHEUS_VERSION} \
            test rules /rules/platform-alerts.test.yml

      - name: Validate Loki configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/loki/loki-config.yml:/etc/loki/local-config.yaml:ro" \
            grafana/loki:${LOKI_VERSION} \
            -config.file=/etc/loki/local-config.yaml \
            -verify-config

      - name: Validate Alloy configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.10.0 \
            validate /etc/alloy/config.alloy

      - name: Verify backup and restore workflow
        run: |
          chmod +x scripts/backup-grafana.sh scripts/verify-restore.sh
          ARCHIVE="$(scripts/backup-grafana.sh)"
          scripts/verify-restore.sh "$ARCHIVE"

      - name: Validate SLO rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus/rules/slo-rules.yml:/rules/slo-rules.yml:ro" \
            --entrypoint promtool \
            prom/prometheus:${PROMETHEUS_VERSION} \
            check rules /rules/slo-rules.yml

      - name: Test SLO rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus/rules:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:${PROMETHEUS_VERSION} \
            test rules /rules/slo-rules.test.yml

      - name: Validate Kubernetes alert rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus/rules/kubernetes-alerts.yml:/rules/kubernetes-alerts.yml:ro" \
            --entrypoint promtool \
            prom/prometheus:${PROMETHEUS_VERSION} \
            check rules /rules/kubernetes-alerts.yml

      - name: Test Kubernetes alert rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/prometheus/rules:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:${PROMETHEUS_VERSION} \
            test rules /rules/kubernetes-alerts.test.yml

      - name: Validate Tempo configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/tempo/tempo.yml:/etc/tempo/tempo.yml:ro" \
            grafana/tempo:2.8.2 \
            -config.file=/etc/tempo/tempo.yml \
            -config.verify=true

      - name: Validate OpenTelemetry configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.133.0 \
            validate \
            --config=/etc/otelcol-contrib/config.yaml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool \
            prom/alertmanager:${ALERTMANAGER_VERSION} \
            check-config /etc/alertmanager/alertmanager.yml
