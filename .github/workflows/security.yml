name: Security validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate YAML
        run: |
          python -m pip install --disable-pip-version-check yamllint
          yamllint \
            -d "{extends: default, rules: {line-length: disable, document-start: disable}}" \
            .github \
            docker \
            examples

      - name: Validate Grafana dashboards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dashboards = list(Path("examples/grafana").glob("*.json"))

          if not dashboards:
              raise SystemExit("No Grafana dashboard JSON files found")

          for path in dashboards:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"validated: {path}")
          PY

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table