global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - severity
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: critical-alerts
      group_wait: 10s
      repeat_interval: 1h

    - matchers:
        - severity="warning"
      receiver: warning-alerts
      group_wait: 1m
      repeat_interval: 6h

    - matchers:
        - severity="info"
      receiver: informational-alerts
      group_wait: 5m
      repeat_interval: 12h

receivers:
  - name: default

  - name: critical-alerts

  - name: warning-alerts

  - name: informational-alerts

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance
