global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: critical-alerts
      repeat_interval: 1h

    - matchers:
        - severity="warning"
      receiver: warning-alerts
      repeat_interval: 6h

receivers:
  - name: default

  - name: critical-alerts

  - name: warning-alerts