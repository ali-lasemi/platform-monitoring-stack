groups:
  - name: platform-infrastructure
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Monitoring target is down"
          description: "Target {{ $labels.instance }} for job {{ $labels.job }} has been unavailable for more than 2 minutes."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Sustained high CPU usage"
          description: "CPU usage on {{ $labels.instance }} has remained above 85% for more than 10 minutes."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Sustained high memory usage"
          description: "Memory usage on {{ $labels.instance }} has remained above 90% for more than 10 minutes."

      - alert: FilesystemSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          ) * 100 < 15
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Filesystem space is running low"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 15% free space."

      - alert: FilesystemSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          ) * 100 < 5
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Filesystem space is critically low"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 5% free space."

      - alert: FilesystemInodesLow
        expr: |
          (
            node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_files{fstype!~"tmpfs|overlay|squashfs"}
          ) * 100 < 10
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Filesystem inodes are running low"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free inodes."

      - alert: HighSystemLoad
        expr: |
          node_load15
          /
          count without(cpu, mode) (
            node_cpu_seconds_total{mode="idle"}
          ) > 1.5
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Sustained high system load"
          description: "15-minute load average on {{ $labels.instance }} is more than 1.5x the available CPU count."

  - name: monitoring-platform
    rules:
      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Prometheus rule evaluation failures detected"
          description: "Prometheus has reported rule evaluation failures during the last 5 minutes."

      - alert: PrometheusTargetScrapeFailures
        expr: increase(prometheus_target_scrapes_exceeded_sample_limit_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Prometheus scrape failures detected"
          description: "One or more Prometheus targets exceeded their configured sample limit."

      - alert: AlertmanagerUnavailable
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Alertmanager is unavailable"
          description: "Prometheus cannot reach Alertmanager for more than 2 minutes."