rule_files:
  - platform-alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="node-1:9100"}'
        values: '0x5'

    alert_rule_test:
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              job: node-exporter
              instance: node-1:9100
            exp_annotations:
              summary: "Monitoring target is down"
              description: "Target node-1:9100 for job node-exporter has been unavailable for more than 2 minutes."

  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="node-1:9100"}'
        values: '1x5'

    alert_rule_test:
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="alertmanager",instance="alertmanager:9093"}'
        values: '0x5'

    alert_rule_test:
      - eval_time: 3m
        alertname: AlertmanagerUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              job: alertmanager
              instance: alertmanager:9093
            exp_annotations:
              summary: "Alertmanager is unavailable"
              description: "Prometheus cannot reach Alertmanager for more than 2 minutes."

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node-1:9100",mountpoint="/",fstype="ext4"}'
        values: '4000000000x20'
      - series: 'node_filesystem_size_bytes{instance="node-1:9100",mountpoint="/",fstype="ext4"}'
        values: '100000000000x20'

    alert_rule_test:
      - eval_time: 6m
        alertname: FilesystemSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              instance: node-1:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "Filesystem space is critically low"
              description: "Filesystem / on node-1:9100 has less than 5% free space."
